name: AIlingo CI

on:
  push:
    paths: ["ailingo/**", ".github/workflows/ailingo.yml"]
  pull_request:
    paths: ["ailingo/**", ".github/workflows/ailingo.yml"]

defaults:
  run:
    working-directory: ailingo

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ailingo
          POSTGRES_PASSWORD: ailingo
          POSTGRES_DB: ailingo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ailingo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ailingo:ailingo@localhost:5432/ailingo_test
      DIRECT_URL: postgresql://ailingo:ailingo@localhost:5432/ailingo_test
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-1234567
      SESSION_HMAC_SECRET: ci-hmac-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ailingo/package-lock.json
      - run: npm ci
      - run: npm run validate:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
