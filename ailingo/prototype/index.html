<title>AIlingo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one centered mobile column (max 560px), sticky stat bar, fixed bottom tab bar, lesson player takes the full screen */
:root{
  --bg:#f6faf6; --surface:#ffffff; --fg:#1f2a24; --muted:#66786d; --line:#e1eae4;
  --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --blue-d:#1899d6; --gold:#ffc800; --gold-d:#d9a600;
  --red:#ff4b4b; --red-d:#d93a3a; --purple:#ce82ff; --ok-bg:#dcf8c3; --ok-fg:#2f6b00; --bad-bg:#ffe0e0; --bad-fg:#a82020;
  --lock:#d9e2dc; --lock-d:#c1ccc5; --sel:#ddf4ff; --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111b16; --surface:#1a2820; --fg:#ebf4ee; --muted:#9db2a5; --line:#2b3c32; --ok-bg:#1d3a12; --ok-fg:#a6ec6e; --bad-bg:#3d1c1e; --bad-fg:#ff9a9a;
  --lock:#2b3c32; --lock-d:#223028; --sel:#12354a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111b16; --surface:#1a2820; --fg:#ebf4ee; --muted:#9db2a5; --line:#2b3c32; --ok-bg:#1d3a12; --ok-fg:#a6ec6e; --bad-bg:#3d1c1e; --bad-fg:#ff9a9a;
  --lock:#2b3c32; --lock-d:#223028; --sel:#12354a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:96px}
h1,h2,h3{margin:0;font-weight:900;text-wrap:balance;line-height:1.15}
p{margin:0 0 10px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons: tactile 3D */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 22px;font-weight:900;font-size:15px;letter-spacing:.05em;text-transform:uppercase;
  background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.big{width:100%;padding:16px 22px}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:0 0 0 var(--line)}
.btn:disabled{background:var(--lock);color:var(--muted);box-shadow:0 4px 0 var(--lock-d);cursor:not-allowed}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:12px}
.iconbtn{background:none;border:0;font-size:22px;padding:6px 10px;border-radius:10px;color:var(--muted)}

/* cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h3{font-size:18px;margin-bottom:6px}
.row{display:flex;gap:12px;align-items:center}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:900;padding:4px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-size:14px}
.prog{height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .35s}
.prog.gold>i{background:var(--gold)}

/* top bar + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 0 10px}
.top .stats{display:flex;gap:6px}
.top .pill{font-size:13px;padding:3px 9px;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav>div{display:flex;max-width:560px;width:100%;gap:4px}
.nav button{flex:1;background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px;font-weight:800;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.nav button span{font-size:22px;line-height:1}
.nav button[aria-current="page"]{background:var(--sel);border-color:var(--blue);color:var(--blue)}

/* landing / onboarding */
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-size:clamp(30px,8vw,42px);margin:10px 0 10px}
.hero h1 b{color:var(--green)}
.hero p{color:var(--muted);font-size:17px;max-width:40ch;margin:0 auto 18px}
.feat{display:grid;gap:10px;margin:18px 0}
.feat div{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.feat span{font-size:26px}
.opt-list{display:grid;gap:10px;margin:14px 0}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--line)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--sel);box-shadow:0 3px 0 var(--blue)}
.field{width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.steps{display:flex;gap:6px;margin:6px 0 14px}.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}.steps i.on{background:var(--green)}

/* skill tree */
.unit{margin:18px 0 8px;border-radius:20px;padding:14px 16px;color:#fff}
.unit small{opacity:.9;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.unit h3{font-size:20px;margin:2px 0}
.unit p{margin:0;opacity:.95;font-size:14px}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 8px}
.node{position:relative;width:78px;height:72px;border-radius:50%;border:0;font-size:30px;display:flex;align-items:center;justify-content:center;transform:translateX(var(--x,0));
  background:var(--c,var(--green));box-shadow:0 6px 0 var(--cd,var(--green-d));color:#fff;transition:filter .1s}
.node:active{transform:translateX(var(--x,0)) translateY(5px);box-shadow:0 1px 0 var(--cd,var(--green-d))}
.node.done{--c:var(--gold);--cd:var(--gold-d)}
.node.locked{--c:var(--lock);--cd:var(--lock-d);color:var(--muted)}
.node.open{animation:pulse 1.8s ease-in-out infinite}
.node .stars{position:absolute;bottom:-14px;font-size:12px;letter-spacing:1px;white-space:nowrap}
.node .go{position:absolute;top:-34px;background:var(--surface);color:var(--green-d);border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-size:13px;font-weight:900;white-space:nowrap}
.node .go::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--cd,var(--green-d)),0 0 0 0 rgba(88,204,2,.45)}50%{box-shadow:0 6px 0 var(--cd,var(--green-d)),0 0 0 12px rgba(88,204,2,0)}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* quests */
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.tracks button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--line)}
.tracks button span{font-size:22px}.tracks button b{font-size:14px;line-height:1.2}.tracks button small{color:var(--muted);font-weight:800}
.tracks button[aria-selected="true"]{border-color:var(--blue);background:var(--sel);box-shadow:0 3px 0 var(--blue)}
.ntitle{font-weight:800;font-size:13px;color:var(--muted);text-align:center;max-width:220px;margin-top:-6px}
.quest{display:grid;gap:4px;margin:10px 0}
.quest b{font-size:15px}
.quest.done b{color:var(--green-d)}

/* lesson player */
.les{display:flex;flex-direction:column;min-height:100dvh;max-width:560px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:8px;padding:14px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .3s}
.hp{font-weight:900;min-width:52px;text-align:right}
.lbody{flex:1;padding:6px 0 280px}
.qtype{font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.qtext{font-size:clamp(20px,5.4vw,25px);margin-bottom:16px}
.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.lfoot>*{max-width:560px;margin-left:auto;margin-right:auto}
.lfoot.fb.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok-fg)}
.lfoot.fb.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad-fg)}
.fbrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;animation:up .18s ease-out}
.fbrow b{font-size:19px;font-weight:900;display:block}
.fbrow p{margin:2px 0 0;font-size:15px;font-weight:700;color:var(--fg)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:13px 14px;font-size:16px;font-weight:700;box-shadow:0 3px 0 var(--line);flex-wrap:wrap}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted)}
.opt .t{flex:1;min-width:0}
.opt .why{flex-basis:100%;font-size:14px;font-weight:700;color:var(--muted);padding-left:40px}
.opt.sel{border-color:var(--blue);background:var(--sel);box-shadow:0 3px 0 var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--ok-bg);box-shadow:0 3px 0 var(--green)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg);box-shadow:0 3px 0 var(--red)}
.badprompt{background:var(--bad-bg);color:var(--bad-fg);border:2px dashed var(--red);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.badprompt small{display:block;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-bottom:2px}
.fill{width:100%;font:inherit;font-weight:800;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.fill.right{border-color:var(--green);background:var(--ok-bg)}.fill.wrong{border-color:var(--red);background:var(--bad-bg)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.fix{font-size:14px;font-weight:800;margin-top:8px;color:var(--ok-fg);background:var(--ok-bg);border-radius:12px;padding:8px 12px}
.slots{display:grid;gap:8px;margin-bottom:14px}
.slot{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px dashed var(--lock-d);border-radius:14px;padding:8px 12px;min-height:56px;font-weight:700}
.slot .sl{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.slot .sv{font-size:15px;color:var(--muted)}
.slot.full{border-style:solid;border-color:var(--line);box-shadow:0 3px 0 var(--line)}.slot.full .sv{color:var(--fg)}
.slot.act{border-color:var(--blue);background:var(--sel)}
.slot.ok{border-color:var(--green);background:var(--ok-bg)}.slot.bad{border-color:var(--red);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;font-size:15px;text-align:left;box-shadow:0 3px 0 var(--line);cursor:grab}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:grid;gap:10px;align-content:start}
.mi{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 10px;font-weight:700;font-size:14.5px;text-align:left;box-shadow:0 3px 0 var(--line)}
.mi.sel{border-color:var(--blue);background:var(--sel)}
.mi.p.c0{border-color:#1cb0f6;background:#ddf4ff;color:#0b4f73}.mi.p.c1{border-color:#ce82ff;background:#f3e1ff;color:#58208a}.mi.p.c2{border-color:#ff9600;background:#ffeacc;color:#7a4300}.mi.p.c3{border-color:#58cc02;background:#e0f8c8;color:#2f6b00}.mi.p.c4{border-color:#ff4b4b;background:#ffe0e0;color:#8a1f1f}
.mi.ok{outline:3px solid var(--green)}.mi.bad{outline:3px solid var(--red)}
.seq{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.seq .ph{color:var(--muted);font-weight:700;border:2px dashed var(--lock-d);border-radius:14px;padding:14px;text-align:center}
.step{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--sel);border:2px solid var(--blue);border-radius:14px;padding:10px 12px;font-weight:700;font-size:15px}
.step b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px}
.step.ok{background:var(--ok-bg);border-color:var(--green)}.step.bad{background:var(--bad-bg);border-color:var(--red)}
.spot{line-height:2.1;font-size:17px;font-weight:700;margin:0}
.seg{background:none;border:0;border-bottom:3px dotted var(--lock-d);padding:2px 1px;font:inherit;text-align:left;margin-right:.3em;border-radius:4px}
.seg:hover{background:var(--sel)}
.seg.sel{background:var(--sel);border-bottom-color:var(--blue)}
.seg.fake{background:var(--bad-bg);border-bottom:3px solid var(--red);color:var(--bad-fg)}
.seg.miss{background:var(--lock)}
.note{background:var(--sel);border:2px solid var(--blue);color:var(--fg);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:10px}
.rb{width:100%;font:inherit;font-size:16px;font-weight:600;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);resize:vertical}
.wc{font-size:13px;color:var(--muted);margin:4px 0 10px;font-weight:700}
.check{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.check li{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:start;font-weight:700;font-size:15px}
.check li.ok span{color:var(--green-d)}.check li.bad span{color:var(--red)}
.check small{grid-column:2/4;color:var(--muted);font-weight:700}
.check em{font-style:normal;color:var(--muted);font-size:13px}
.score{font-size:30px;font-weight:900;margin:8px 0 2px}.score small{font-size:16px;color:var(--muted)}
.model{background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:10px 12px;margin-top:10px;font-weight:700;font-size:15px}
.model small{display:block;font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--gold-d);margin-bottom:2px}

/* summary screens */
.sum{text-align:center;padding:36px 0 24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sum h1{font-size:30px}
.sstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:16px 0 22px}
.sstats div{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px}
.sstats b{display:block;font-size:22px}.sstats small{color:var(--muted);font-weight:800;font-size:12px}
.lvl{font-size:76px;font-weight:900;color:var(--gold);line-height:1;text-shadow:0 4px 0 var(--gold-d)}

/* lists */
.lb{display:grid;gap:6px;margin:8px 0}
.lb .r{display:grid;grid-template-columns:34px 38px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;font-weight:800}
.lb .r.me{background:var(--sel);border:2px solid var(--blue)}
.lb .r.up{box-shadow:inset 4px 0 0 var(--green)}.lb .r.down{box-shadow:inset 4px 0 0 var(--red)}
.av{width:38px;height:38px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:20px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bd{border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;font-size:13px;font-weight:800;background:var(--surface)}
.bd span{font-size:32px;display:block}.bd.off{opacity:.45;filter:grayscale(1)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;font-weight:800}
.cal i{font-style:normal;aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:var(--line);color:var(--muted)}
.cal i.a{background:#bfeb8f;color:#1f4a00}.cal i.g{background:var(--green);color:#fff}.cal i.t{outline:3px solid var(--blue)}.cal i.e{background:none}
.seg2{display:flex;gap:6px}.seg2 button{flex:1;padding:10px;border:2px solid var(--line);background:var(--surface);border-radius:12px;font-weight:900}
.seg2 button[aria-pressed="true"]{border-color:var(--blue);background:var(--sel);color:var(--blue)}
textarea.out{width:100%;height:180px;font:12px ui-monospace,monospace;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:10px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;display:none}

/* mascot */
.mascot{display:block;overflow:visible}
.mascot .ant{transform-origin:50px 24px;animation:wob 2.4s ease-in-out infinite}
.mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
.mascot.mood-cheer{animation:hop .5s ease-out 2}
.mascot.mood-sad{animation:shake .45s ease-in-out 1}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;margin:6px auto 0;max-width:34ch}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
'use strict';
/* ====================== helpers ====================== */
var $=function(s,el){return (el||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var KEY='ailingo.v1';
var FEATURES={aiGrader:false};            /* feature flag: OFF by default. Nothing in this file calls any AI service. */

function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function weekKey(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return dkey(x)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function shuffleNotIdentity(n){var base=[];for(var i=0;i<n;i++)base.push(i);var a=shuffle(base),tries=0;while(a.every(function(v,i){return v===i})&&tries++<10)a=shuffle(base);return a}

var DIA=new RegExp('['+String.fromCharCode(0x300)+'-'+String.fromCharCode(0x36f)+']','g'),DJ=new RegExp(String.fromCharCode(0x111),'g');
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(DIA,'').replace(DJ,'d').replace(/dj/g,'d').replace(/[^a-z0-9% ]+/g,' ').replace(/\s+/g,' ').trim()}
function hasKw(textNorm,kw){var k=norm(kw);if(!k)return false;var t=' '+textNorm+' ';return /\s$/.test(kw)?t.indexOf(' '+k+' ')>=0:t.indexOf(' '+k)>=0}
var gradeFns={
  mc:function(e,a){return {correct:a===e.answer}},
  doctor:function(e,a){return {correct:a===e.answer}},
  compare:function(e,a){return {correct:a===e.answer}},
  tf:function(e,a){return {correct:(a===0)===e.answer}},
  fill:function(e,a){var list=(e.answers.hr||[]).concat(e.answers.en||[]).map(norm);return {correct:list.indexOf(norm(a))>=0}},
  spot:function(e,a){return {correct:a===e.bad}},
  build:function(e,a){var ok=0;e.parts.forEach(function(_,i){if(a[i]===i)ok++});return {correct:ok===e.parts.length,score:Math.round(ok/e.parts.length*100)}},
  match:function(e,a){var ok=0;e.pairs.forEach(function(_,i){if(a[i]===i)ok++});return {correct:ok===e.pairs.length,score:Math.round(ok/e.pairs.length*100)}},
  order:function(e,a){var ok=0;e.steps.forEach(function(_,i){if(a[i]===i)ok++});return {correct:ok===e.steps.length,score:Math.round(ok/e.steps.length*100)}},
  rubric:function(e,a){var r=e.rubric,tx=norm(a),words=a.trim().split(/\s+/).filter(Boolean).length,list=[],score=0;
    var lenOk=words>=r.minWords;list.push({id:'len',label:[ 'Najmanje '+r.minWords+' riječi','At least '+r.minWords+' words'],pts:r.lenPts,passed:lenOk,hint:['Opišite zahtjev malo detaljnije.','Describe the request in a bit more detail.']});
    r.criteria.forEach(function(c){var kws=(c.kw.hr||[]).concat(c.kw.en||[]);list.push({id:c.id,label:c.label,pts:c.pts,passed:kws.some(function(k){return hasKw(tx,k)}),hint:c.hint})});
    var vg=(r.vague.hr||[]).concat(r.vague.en||[]);list.push({id:'vague',label:['Bez preopćenitih riječi','No overly generic words'],pts:r.vaguePts,passed:!vg.some(function(k){return hasKw(tx,k)}),hint:['Zamijenite općenite riječi („nešto”, „kreativno”) konkretnim zahtjevom.','Replace generic words (“something”, “creative”) with a concrete request.']});
    list.forEach(function(x){if(x.passed)score+=x.pts});return {correct:score>=r.pass,score:score,checklist:list,model:r.model}}
};
var DeterministicGrader={id:'deterministic',grade:function(ex,answer){return Promise.resolve(gradeFns[ex.type](ex,answer)).then(function(r){r.explanation=L(ex.explain);if(r.score==null)r.score=r.correct?100:0;return r})}};

/* ====================== SM-2 + gamification logic ====================== */
function sm2(item,q){if(q<3){item.rep=0;item.int=1;item.lapses=(item.lapses||0)+1}else{item.rep++;item.int=item.rep===1?1:item.rep===2?6:Math.round(item.int*item.ease)}
  item.ease=Math.max(1.3,item.ease+0.1-(5-q)*(0.08+(5-q)*0.02));item.due=Date.now()+item.int*864e5;return item}
function levelNeed(n){return 75*n*(n-1)}
function levelFor(xp){var l=1;while(xp>=levelNeed(l+1))l++;return l}
function tickHearts(){if(S.hearts>=5){S.hearts=5;S.heartsAt=0;return}var now=Date.now();if(!S.heartsAt)S.heartsAt=now;var n=Math.floor((now-S.heartsAt)/HEART_MS);if(n>0){S.hearts=Math.min(5,S.hearts+n);S.heartsAt=S.hearts>=5?0:S.heartsAt+n*HEART_MS}}
function loseHeart(){if(S.hearts>=5)S.heartsAt=Date.now();S.hearts=Math.max(0,S.hearts-1)}
function touchStreak(){var t=today(),st=S.streak;if(st.last===t)return;if(!st.last)st.cur=1;else{var d=daysBetween(st.last,t);if(d===1)st.cur++;else if(d===2&&S.freezes>0){S.freezes--;st.cur++;toast(tr('Streak Freeze je spasio tvoj niz! 🧊','Streak Freeze saved your streak! 🧊'))}else st.cur=1}st.last=t;st.best=Math.max(st.best,st.cur)}
function streakShown(){var st=S.streak;if(!st.last)return 0;var d=daysBetween(st.last,today());return d<=1||(d===2&&S.freezes>0)?st.cur:0}
function todayXp(){return S.activity[today()]||0}
function addXp(n){if(n<=0)return;var before=todayXp();S.xp+=n;S.weekXp+=n;S.activity[today()]=before+n;touchStreak();
  if(before<GOALXP[S.dailyGoal]&&before+n>=GOALXP[S.dailyGoal]){toast(tr('Dnevni cilj ostvaren! 🎯','Daily goal reached! 🎯'))}}
function ensureQuests(){if(S.quests.date!==today()){S.quests={date:today(),items:CONTENT.meta.quests.map(function(q){return {id:q.id,progress:0,done:false}})}}}
function questProgress(id,n){ensureQuests();var it=S.quests.items.find(function(x){return x.id===id});if(!it||it.done)return;var def=CONTENT.meta.quests.find(function(x){return x.id===id});
  it.progress=def.mode==='max'?Math.max(it.progress,n):it.progress+n;if(it.progress>=def.target){it.progress=def.target;it.done=true;addXp(def.reward);S.gems+=3;toast('✅ '+L(def.title)+' · +'+def.reward+' XP')}}
function isDone(id){return !!(S.progress[id]&&S.progress[id].done)}
function statVal(st){if(st.indexOf('unit:')===0){var u=CONTENT.byUnit[st.slice(5)];return u&&u.lessons.length&&u.lessons.every(function(l){return isDone(l.id)})?1:0}
  if(st.indexOf('track:')===0){var tl=trackLessons(st.slice(6));return tl.length&&tl.every(function(x){return isDone(x.l.id)})?1:0}
  if(st==='streakBest')return S.streak.best;if(st==='xpTotal')return S.xp;if(st==='friends')return S.friends.length;
  if(st==='lessonsDone')return Object.keys(S.progress).filter(function(k){return S.progress[k].done}).length;return S.stats[st]||0}
function checkBadges(){CONTENT.meta.badges.forEach(function(b){if(S.badges.indexOf(b.id)<0&&statVal(b.rule.stat)>=b.rule.gte){S.badges.push(b.id);S.gems+=5;toast('🏅 '+L(b.title));sfx('combo')}})}
function recordMistake(id){var m=S.mistakes[id]||{n:0};m.n++;S.mistakes[id]=m;var r=S.review[id]||{ease:2.5,int:0,rep:0,lapses:0,due:0};r.due=Date.now();r.lapses=(r.lapses||0)+1;S.review[id]=r}
function dueIds(){var now=Date.now();return Object.keys(S.review).filter(function(id){return S.review[id].due<=now&&CONTENT.byId[id]})}

/* league (deterministic bots) */
function botXp(name,wk,tier,final){var r=seeded(name+wk+tier),target=60+Math.floor(r()*(650+tier*150)),j=r();if(final)return target;
  var n=new Date(),frac=Math.min(1,(((n.getDay()+6)%7)+n.getHours()/24+.15)/7*(0.75+j*.5));return Math.round(target*frac)}
function leagueRows(wk,tier,myXp,final){var names=(function(){var r=seeded('lg'+wk+tier),a=CONTENT.meta.bots.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a.slice(0,29)})();
  var av=CONTENT.meta.avatars,rows=names.map(function(nm,i){return {name:nm,xp:botXp(nm,wk,tier,final),av:av[i%av.length],me:false}});
  rows.push({name:S.name||tr('Ti','You'),xp:myXp,av:'🤖',me:true});rows.sort(function(a,b){return b.xp-a.xp||(a.me?-1:1)});return rows}
function weekRoll(){var wk=weekKey(new Date());if(S.week===wk)return;var rows=leagueRows(S.week,S.tier,S.weekXp,true),rank=rows.findIndex(function(r){return r.me})+1,delta=0;
  if(S.weekXp>0){if(rank<=10&&S.tier<CONTENT.meta.tiers.length-1)delta=1;else if(rank>25&&S.tier>0)delta=-1}
  S.lastLeague={rank:rank,delta:delta,tier:S.tier,xp:S.weekXp};S.tier+=delta;S.week=wk;S.weekXp=0;save()}

function loadContent(){
  function get(f){return fetch('content/'+f).then(function(r){if(!r.ok)throw new Error(f+' '+r.status);return r.json()})}
  return get('meta.json').then(function(meta){return Promise.all(meta.unitFiles.map(get)).then(function(files){
    var byUnit={};
    files.forEach(function(f){(Array.isArray(f)?f:[f]).forEach(function(u){var d=meta.unitDefaults[u.id];if(d){u.track=u.track||d.track;u.level=u.level||d.level}u.key=u.key||('u'+u.order);if(u.published===undefined)u.published=true;
      u.lessons.forEach(function(l,i){l.id=l.id||u.key+'l'+(i+1);l.exercises.forEach(function(e,j){e.id=e.id||l.id+'e'+(j+1)})});byUnit[u.id]=u})});
    var units=[],byId={};
    meta.tracks.forEach(function(t){t.order.forEach(function(id,i){var u=byUnit[id];u.idx=i+1;units.push(u)})});
    units.forEach(function(u){u.lessons.forEach(function(l){l.exercises.forEach(function(e){byId[e.id]={ex:e,lesson:l,unit:u}})})});
    CONTENT={meta:meta,units:units,byId:byId,byUnit:byUnit}})})}
function trackLessons(track){var o=[];CONTENT.units.forEach(function(u){if(u.track===track&&u.published)u.lessons.forEach(function(l){o.push({u:u,l:l})})});return o}
function flatLessons(){var o=[];CONTENT.units.forEach(function(u){if(u.published)u.lessons.forEach(function(l){o.push({u:u,l:l})})});return o}
function lessonState(id){var info=lessonById(id);if(!info||!info.u.published)return 'locked';var fl=trackLessons(info.u.track),i=fl.findIndex(function(x){return x.l.id===id});if(i<0)return 'locked';if(isDone(id))return 'done';return i===0||isDone(fl[i-1].l.id)?'open':'locked'}
function lessonById(id){for(var i=0;i<CONTENT.units.length;i++){var l=CONTENT.units[i].lessons.find(function(x){return x.id===id});if(l)return {l:l,u:CONTENT.units[i]}}}
function prep(ex){var c;
  if(ex.type==='mc'||ex.type==='doctor'){var perm=shuffle(ex.options.map(function(_,i){return i}));c=Object.assign({},ex);c.options=perm.map(function(i){return ex.options[i]});c.answer=perm.indexOf(ex.answer);return c}
  if(ex.type==='compare'&&!/(Tekst|Text|Zahtjev|Request)\s+[AB]\b/.test(ex.explain.join(' '))&&Math.random()<.5){c=Object.assign({},ex);c.a=ex.b;c.b=ex.a;c.answer=1-ex.answer;return c}
  return ex}

R.build=function(ex,host,api){var n=ex.parts.length,placed=[],order=shuffleNotIdentity(n),active=-1,locked=false,mark=null,i;for(i=0;i<n;i++)placed.push(-1);

  SES={mode:cfg.mode,lessonId:cfg.lessonId,title:cfg.title,queue:cfg.exercises.map(prep),total:cfg.mode==='blitz'?0:cfg.exercises.length,done:0,firstTry:0,answered:0,wrong:0,combo:0,comboBest:0,xp:0,retried:{},start:Date.now(),cur:null,endAt:cfg.mode==='blitz'?Date.now()+60000:0,fixed:0,lvl0:levelFor(S.xp),noHearts:false,timer:null,correct:0};
  drawSession()}
function drawSession(){var s=SES;app.innerHTML='<div class="les"><div class="lhead"><button class="iconbtn" data-act="quit" aria-label="'+esc(tr('Izađi iz lekcije','Leave the lesson'))+'">✕</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="'+esc(tr('Napredak','Progress'))+'"><i id="barfill"></i></div><div class="hp" id="hp"></div></div><div class="lbody" id="qwrap"></div><div class="lfoot" id="foot" role="status"></div></div>';
  updateHead();showQuestion();
  if(s.mode==='blitz')s.timer=setInterval(function(){if(SES!==s){clearInterval(s.timer);return}updateHead();if(Date.now()>=s.endAt){clearInterval(s.timer);finishSession()}},200)}
function updateHead(){var s=SES,bar=$('#barfill');if(!bar)return;var pct=s.mode==='blitz'?Math.max(0,(s.endAt-Date.now())/600):(s.total?s.done/s.total*100:0);bar.style.width=pct+'%';bar.parentElement.setAttribute('aria-valuenow',Math.round(pct));
  $('#hp').textContent=s.mode==='lesson'?'❤️ '+S.hearts:s.mode==='blitz'?'⏱ '+Math.max(0,Math.ceil((s.endAt-Date.now())/1000))+'s':''}
function showQuestion(){var s=SES;if(!s.queue.length){finishSession();return}var ex=s.queue[0],w=$('#qwrap');
  w.innerHTML='<div class="qtype">'+esc(L(TYPE[ex.type]))+'</div><h2 class="qtext">'+esc(L(ex.q))+'</h2><div id="exbody"></div>';
  s.cur={ex:ex,answer:null,checked:false};
  s.cur.r=R[ex.type](ex,$('#exbody'),{onChange:function(a){s.cur.answer=a;setFoot();if(s.mode==='blitz'&&a!==null&&(ex.type==='mc'||ex.type==='tf'||ex.type==='compare'))check()}});
  setFoot();window.scrollTo(0,0)}

  if(b){b.disabled=!ready;return}f.className='lfoot';f.innerHTML='<button class="btn big" id="chk" data-act="check"'+(ready?'':' disabled')+'>'+esc(tr('Provjeri','Check'))+'</button>'}

  getGrader().grade(c.ex,c.answer,S.lang).catch(function(){return DeterministicGrader.grade(c.ex,c.answer,S.lang)}).then(function(res){if(SES!==s)return;c.res=res;c.r.reveal(res);applyResult(res);showFeedback(res)})}
function applyResult(res){var s=SES,ex=s.cur.ex,first=!s.retried[ex.id];s.answered++;S.stats.answered++;
  if(res.correct){S.stats.correct++;s.correct++;if(first)s.firstTry++;s.combo++;s.comboBest=Math.max(s.comboBest,s.combo);S.stats.comboBest=Math.max(S.stats.comboBest,s.combo);

function finishSession(failed){var s=SES;if(!s)return;clearInterval(s.timer);var secs=Math.round((Date.now()-s.start)/1000),mm=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');

  if(s.mode==='placement'){var score=s.correct,th=CONTENT.meta.placement.thresholds.filter(function(t){return t.min<=score}).pop(),n=0;th.complete.forEach(function(id){if(!isDone(id)){S.progress[id]={done:true,stars:1,runs:0};n++}});S.placementDone=true;checkBadges();save();SES=null;sfx('finish');confetti();

  +'<div class="card"><h3>'+esc(tr('O ocjenjivanju','About grading'))+'</h3><p class="muted" style="font-size:14px;margin:0">'+esc(tr('Sve provjere su deterministička pravila iz podatkovnih datoteka. AI grader: ','All checks are deterministic rules from data files. AI grader: '))+'<b>'+(FEATURES.aiGrader?'ON':'OFF')+'</b>. '+esc(tr('Nijedan vanjski servis se ne poziva.','No external service is ever called.'))+'</p></div>'
  +'<div class="card"><h3>'+esc(tr('Prijava','Sign-in'))+'</h3><p class="muted" style="font-size:14px">'+esc(tr('Auth.js (email + Google) stiže u pravoj aplikaciji; napredak iz guest moda prenosi se pri registraciji.','Auth.js (email + Google) arrives in the full app; guest progress transfers on sign-up.'))+'</p><div class="grid2"><button class="btn sm ghost" disabled>Google</button><button class="btn sm ghost" disabled>Email</button></div></div>'}

function render(){if(!CONTENT||SES)return;tickHearts();ensureQuests();weekRoll();
  if(!S.onboarded){if(showLanding)landing();else onboard();return}
  var body=view==='learn'?learnView():view==='practice'?practiceView():view==='leagues'?leaguesView():view==='friends'?friendsView():view==='settings'?settingsView():profileView();
  app.innerHTML=topbar()+'<main id="main">'+body+'</main>'+nav()}

/* ====================== actions ====================== */
function startLesson(id){var info=lessonById(id);sheet=null;startSession({mode:'lesson',lessonId:id,title:L(info.l.title),exercises:info.l.exercises})}
function pool(types,max){var ids=[];CONTENT.units.forEach(function(u){u.lessons.forEach(function(l){if(isDone(l.id))l.exercises.forEach(function(e){ids.push(e)})})});if(!ids.length)flatLessons().forEach(function(x){x.l.exercises.forEach(function(e){ids.push(e)})});
  return shuffle(ids.filter(function(e){return !types||types.indexOf(e.type)>=0})).slice(0,max)}
var ACT={
 track:function(d){S.track=d.v;save();render()},
 start:function(){showLanding=false;render()},
 guest:function(){S.onboarded=true;S.name='';save();view='learn';render()},
 lang:function(d){S.lang=d.v;if(!S.onboarded)OB.name=($('#obname')||{}).value||OB.name;save();render()},
 ob:function(d){var k=d.k;OB[k]=k==='daily'?+d.v:d.v;render()},
 obnext:function(){if(OB.step===0)OB.name=($('#obname')||{}).value||'';OB.step++;render()},
 obdone:function(){finishOnboard(false)},obplace:function(){finishOnboard(true)},
 nav:function(d){view=d.v;sheet=null;confirmDel=false;exportOpen=false;render();window.scrollTo(0,0)},
 node:function(d){sheet=d.id;render()},closesheet:function(d,e){if(e.target.closest('[data-stop]')&&!e.target.closest('button'))return;sheet=null;render()},
 lesson:function(d){startLesson(d.id)},
 placement:function(){startSession({mode:'placement',title:'',exercises:CONTENT.meta.placement.exercises.map(function(id){return CONTENT.byId[id].ex})})},
 review:function(){var ids=dueIds().slice(0,8);startSession({mode:'practice',exercises:ids.map(function(id){return CONTENT.byId[id].ex})})},
 free:function(){startSession({mode:'practice',exercises:pool(null,8)})},
 blitz:function(){startSession({mode:'blitz',exercises:pool(['mc','tf','compare','fill'],60)})},
 check:function(){check()},next:function(){next()},
 quit:function(){var s=SES;if(!s)return;if(s.mode==='lesson'&&s.done===0){leave();return}$('#foot').className='lfoot';$('#foot').innerHTML='<p style="text-align:center;font-weight:900;margin:0 0 10px">'+esc(tr('Sigurno? Napredak ove lekcije se gubi.','Sure? This lesson\'s progress will be lost.'))+'</p><div class="grid2"><button class="btn ghost" data-act="resume">'+esc(tr('Nastavi učiti','Keep learning'))+'</button><button class="btn red" data-act="leave">'+esc(tr('Izađi','Leave'))+'</button></div>'},
 resume:function(){var c=SES.cur;if(c.checked){showFeedback(c.res)}else{$('#foot').innerHTML='';setFoot()}},
 leave:function(){leave()},
 home:function(){SES=null;view='learn';render();window.scrollTo(0,0)},
 toPractice:function(){SES=null;view='practice';render();window.scrollTo(0,0)},
 levelup:function(){screenLevelUp()},
 sound:function(){S.sound=!S.sound;save();if(S.sound)sfx('correct');render()},
 goal:function(d){S.dailyGoal=+d.v;save();render()},
 buyFreeze:function(){if(S.gems>=20&&S.freezes<2){S.gems-=20;S.freezes++;save();toast('🧊 Streak Freeze +1');render()}},
 buyHearts:function(){if(S.gems>=10&&S.hearts<5){S.gems-=10;S.hearts=5;S.heartsAt=0;save();toast('❤️ '+tr('Srca napunjena','Hearts refilled'));if(SES)return;if($('.sum')){ACT.home()}else render()}},
 addfriend:function(d){var i=+d.i;if(S.friends.indexOf(i)<0){S.friends.push(i);checkBadges();save();render()}},
 export:function(){exportOpen=!exportOpen;render()},
 copyexp:function(){var t=$('#exp');try{navigator.clipboard.writeText(t.value).then(function(){toast(tr('Kopirano','Copied'))},function(){t.select()})}catch(e){t.select()}},
 delete:function(){if(!confirmDel){confirmDel=true;render();return}try{localStorage.removeItem(KEY)}catch(e){}S=defState();confirmDel=false;exportOpen=false;showLanding=true;OB={step:0,name:'',goal:'',level:'',daily:10};ensureQuests();render();toast(tr('Svi podaci obrisani','All data deleted'))}
};
function leave(){clearInterval(SES&&SES.timer);SES=null;view='learn';render();window.scrollTo(0,0)}
function finishOnboard(place){S.onboarded=true;S.name=OB.name.trim();S.goal=OB.goal;S.level=OB.level;S.dailyGoal=OB.daily;save();view='learn';render();if(place)ACT.placement()}
document.addEventListener('click',function(e){var a=e.target.closest('[data-act]');if(!a)return;var f=ACT[a.dataset.act];if(!f)return;ac();f(a.dataset,e)});
document.addEventListener('change',function(e){if(e.target.id==='setname'){S.name=e.target.value.trim();save()}});
document.addEventListener('input',function(e){if(e.target.id==='obname')OB.name=e.target.value});
document.addEventListener('keydown',function(e){var s=SES;if(!s||!s.cur)return;var c=s.cur,tag=e.target.tagName;
  if(e.key==='Enter'){if(tag==='BUTTON')return;if(tag==='TEXTAREA'&&!(e.ctrlKey||e.metaKey))return;e.preventDefault();if(!c.checked)check();else next();return}
  if(!c.checked&&tag!=='INPUT'&&tag!=='TEXTAREA'&&/^[1-9]$/.test(e.key)&&c.r.pick)c.r.pick(+e.key-1)});

/* ====================== boot ====================== */
S=load();
app.innerHTML='<p class="muted" style="text-align:center;padding:60px 0">…</p>';
loadContent().then(function(){ensureQuests();render()}).catch(function(err){app.innerHTML='<div class="card" style="margin-top:40px"><h3>'+esc('Content failed to load')+'</h3><p class="muted">'+esc(String(err))+'</p></div>'});
})();
</script>
