plugins { id 'com.android.application' }
android {
    namespace 'com.tvremote.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tvremote.app'
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName '7.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    testOptions { unitTests { includeAndroidResources = true; all { systemProperty 'shots.dir', "$buildDir/shots" } } }
    packagingOptions { resources { excludes += ['META-INF/versions/**', 'META-INF/MANIFEST.MF'] } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.78.1'
}
